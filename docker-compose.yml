services:
  tyxnet-server:
    build:
      context: .
      dockerfile: packaging/docker/Dockerfile
    image: ghcr.io/fbeser/tyxnet:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:8443:8443/tcp"
      - "51830:51830/udp"
    volumes:
      - tyxnet-data:/var/lib/tyxnet
      - ./configs/server.docker.yaml:/etc/tyxnet/server.yaml:ro
volumes:
  tyxnet-data:
