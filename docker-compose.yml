services:
  tyxnet-server:
    image: ghcr.io/fbeser/tyxnet:latest
    restart: unless-stopped
    command: ["run", "--config", "/etc/tyxnet/server.yaml", "--lan-web"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8443:8443/tcp"
      - "51830:51830/udp"
    volumes:
      - tyxnet-data:/var/lib/tyxnet
volumes:
  tyxnet-data:
