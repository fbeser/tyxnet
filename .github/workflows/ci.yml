name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x', cache: true}
      - run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go test -race ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with: {version: v2.1.6}
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/...
      - run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/...
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f internal/control/server.go
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., file: packaging/docker/Dockerfile, push: false}
  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x'}
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
