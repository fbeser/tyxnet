name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.26.x', cache: true}
      - run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go test -race ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with: {version: v2.12.2}
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/tyxnet-server ./cmd/tyxnet-client ./cmd/tyxnetctl
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/tyxnet-server ./cmd/tyxnet-client ./cmd/tyxnetctl
      - run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/tyxnet-server ./cmd/tyxnet-client ./cmd/tyxnetctl
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/tyxnet-server ./cmd/tyxnet-client ./cmd/tyxnetctl
  desktop-tray:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.26.x', cache: true}
      - run: go build ./cmd/tyxnet-tray ./cmd/tyxnet-server-tray
      - run: go test ./cmd/tyxnet-tray ./cmd/tyxnet-server-tray ./internal/application
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test -f internal/control/server.go
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: sudo mkdir -p /dev/net && sudo mknod /dev/net/tun c 10 200 && sudo chmod 666 /dev/net/tun
      - run: sh scripts/test-docker.sh
  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.26.x'}
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
