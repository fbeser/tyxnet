version: "3.3"

services:
  tyxnet-server:
    image: ghcr.io/fbeser/tyxnet:latest
    restart: unless-stopped
    command: ["run", "--config", "/etc/tyxnet/server.https.yaml"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    expose:
      - "8443"
    ports:
      - "51830:51830/udp"
    volumes:
      - tyxnet-data:/var/lib/tyxnet

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    command: ["run", "--config", "/etc/caddy/Caddyfile"]
    environment:
      TYXNET_PUBLIC_IP: "${TYXNET_PUBLIC_IP}"
    ports:
      - "${TYXNET_HTTP_CHALLENGE_PORT:-18080}:80/tcp"
      - "${TYXNET_HTTPS_PORT:-18443}:443/tcp"
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tyxnet-data:
  caddy-data:
  caddy-config:
