listen_address: 0.0.0.0
api_port: 8443
tunnel_port: 51830
tunnel_enabled: true
tunnel_name: TyxNet
tunnel_address: 10.90.0.1
tunnel_mtu: 1280
network: 10.90.0.0/24
database: /var/lib/tyxnet/tyxnet.db
